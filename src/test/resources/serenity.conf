serenity {
  project.name = "SerenityBDD Appium Mobile Automation"
  take.screenshots = BEFORE_AND_AFTER_EACH_STEP
  restart.browser.for.each = feature
  outputDirectory = "target/site/serenity"
}

environments {
    edge {
        webdriver {
          driver = edge
          # Esta línea es la que soluciona tu problema de DNS y Versión
          webdriver.edge.driver = "src/test/resources/drivers/msedgedriver.exe"
          autodownload = false
          capabilities {
            browserName = "MicrosoftEdge"
            acceptInsecureCerts = true
            "ms:edgeOptions" {
                args = [
                    "remote-allow-origins=*",
                    "test-type",
                    "no-sandbox",
                    "ignore-certificate-errors",
                    "--window-size=1000,800",
                    "inprivate",
                    "disable-infobars",
                    "disable-gpu",
                    "disable-default-apps",
                    "disable-popup-blocking",
                    "disable-dev-shm-usage",
                    "disable-extensions",
                    "disable-web-security",
                    "disable-translate",
                    "disable-logging",
                    "disable-save-password-bubble"
                ]
            }
          }
        }
    }

    android {
        webdriver { driver = appium }
        appium {
            hub = "http://localhost:4723/"
            platformName = Android
            deviceName = "Pixel 9a"
            "appium:platformVersion" = "16"
            appPackage = "com.google.android.youtube"
            appActivity = "com.google.android.youtube.HomeActivity"
            automationName = UIAutomator2
        }
    }

    ios {
        webdriver { driver = appium }
        appium {
            hub = "http://127.0.0.1:4723/"
            platformName = "iOS"
            deviceName = "iPhone 12 Pro Max"
            platformVersion = "18.3.2"
            bundleId = "com.google.ios.youtube"
            automationName = "XCUITest"
        }
    }
}